<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TX TMS 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --sunk:#EEF0F3; --ink:#1B2433; --sub:#5A6475; --faint:#8C95A4;
  --line:#E1E4EA; --line2:#CBD0D8; --navy:#1E2A44; --navy-h:#2A3A5E; --focus:#2E62C9;
  --mark:#FFE27A; --mark-soft:#FFF6CC; --danger:#C0392B; --danger-soft:#FBEDEB;
  --s-draft:#7D8594; --s-wait:#A86A12; --s-review:#2E62C9; --s-ask:#C2410C; --s-appr:#6A47B5; --s-done:#1B7F5A;
  --r-sm:5px; --r-md:8px; --r-lg:12px;
  --pop:0 8px 28px rgba(20,30,50,.14), 0 1px 3px rgba(20,30,50,.08);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161D; --surface:#1A1F28; --sunk:#151A21; --ink:#E6E9EE; --sub:#A3ABB8; --faint:#7A8392;
  --line:#2A313C; --line2:#3A4250; --navy:#C9D4EC; --navy-h:#E0E7F6; --focus:#7FA2F0;
  --mark:#7A6420; --mark-soft:#3A331A; --danger:#F08A7E; --danger-soft:#3A2220;
  --s-draft:#9AA2B0; --s-wait:#E0A646; --s-review:#7FA2F0; --s-ask:#F2935A; --s-appr:#B39AF0; --s-done:#5CC79A;
  --pop:0 8px 28px rgba(0,0,0,.5); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#12161D; --surface:#1A1F28; --sunk:#151A21; --ink:#E6E9EE; --sub:#A3ABB8; --faint:#7A8392;
  --line:#2A313C; --line2:#3A4250; --navy:#C9D4EC; --navy-h:#E0E7F6; --focus:#7FA2F0;
  --mark:#7A6420; --mark-soft:#3A331A; --danger:#F08A7E; --danger-soft:#3A2220;
  --s-draft:#9AA2B0; --s-wait:#E0A646; --s-review:#7FA2F0; --s-ask:#F2935A; --s-appr:#B39AF0; --s-done:#5CC79A;
  --pop:0 8px 28px rgba(0,0,0,.5); color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:400 14px/1.55 "IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* shell */
#root{height:100%}
#app{height:100%;display:grid;grid-template-columns:232px 1fr;grid-template-rows:56px 40px 1fr}
.side{grid-row:1/4;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{height:56px;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid var(--line)}
.brand-mark{width:26px;height:26px;border-radius:6px;background:var(--navy);color:var(--surface);display:grid;place-items:center;font-weight:700;font-size:12px;letter-spacing:-.02em}
.brand b{font-size:15px;letter-spacing:-.01em}
.brand small{color:var(--faint);font-size:12px;margin-left:auto}
.nav{padding:14px 10px;overflow:auto;flex:1}
.nav h6{margin:16px 10px 6px;font-size:12px;font-weight:500;color:var(--faint)}
.nav h6:first-child{margin-top:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:7px 10px;border-radius:var(--r-sm);cursor:pointer;text-align:left;color:var(--sub)}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button.on{background:var(--sunk);color:var(--ink);font-weight:600}
.nav button .cnt{margin-left:auto;font-size:12px;color:var(--sub);font-weight:500}
.nav svg{width:16px;height:16px;flex:none}
.side-foot{border-top:1px solid var(--line);padding:10px}
.side-foot button{width:100%;border:1px dashed var(--line2);background:none;border-radius:var(--r-sm);padding:8px 10px;cursor:pointer;color:var(--sub);text-align:left;font-size:13px}
.side-foot button:hover{color:var(--ink);border-color:var(--sub)}

.top{grid-column:2;display:flex;align-items:center;gap:12px;padding:0 18px;background:var(--surface);border-bottom:1px solid var(--line);min-width:0}
.ctx{display:flex;align-items:center;gap:6px;min-width:0}
.ctx select{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:5px 8px;max-width:200px}
.ctx .slash{color:var(--line2)}
.top .grow{flex:1}
.iconbtn{position:relative;width:34px;height:34px;display:grid;place-items:center;border:1px solid transparent;background:none;border-radius:var(--r-sm);cursor:pointer;color:var(--sub)}
.iconbtn:hover{background:var(--sunk);color:var(--ink)}
.iconbtn svg{width:18px;height:18px}
.iconbtn .dot{position:absolute;top:5px;right:5px;min-width:16px;height:16px;border-radius:8px;background:var(--danger);color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center;padding:0 4px;border:2px solid var(--surface)}
.me{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--r-sm);padding:4px 10px 4px 4px;background:none;cursor:pointer}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;color:#fff;flex:none}
.me span{font-size:13px}
.me em{font-style:normal;color:var(--faint);font-size:12px}
.menu-btn{display:none}

.tabs{grid-column:2;display:flex;align-items:flex-end;gap:2px;padding:0 12px;background:var(--bg);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:6px;height:32px;padding:0 6px 0 12px;border:1px solid transparent;border-bottom:0;border-radius:var(--r-sm) var(--r-sm) 0 0;background:none;cursor:pointer;color:var(--sub);white-space:nowrap;font-size:13px;max-width:240px;flex:none;position:relative;top:1px}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--surface);border-color:var(--line);color:var(--ink);font-weight:500}
.tab .t{overflow:hidden;text-overflow:ellipsis}
.tab .dirty{width:6px;height:6px;border-radius:50%;background:var(--s-ask)}
.tab .x{width:20px;height:20px;border-radius:4px;display:grid;place-items:center;color:var(--faint);border:0;background:none;cursor:pointer}
.tab .x:hover{background:var(--sunk);color:var(--ink)}
.hit{box-shadow:0 0 0 3px var(--mark)}
.tab-add{height:28px;width:28px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);cursor:pointer;margin:0 0 4px 6px;flex:none;color:var(--sub)}
.tab-add:hover{color:var(--ink);border-color:var(--line2)}

main{grid-column:2;overflow:auto;min-height:0;background:var(--surface)}
.page{padding:26px 32px 64px;max-width:1440px}
.page.wide{max-width:none}
.ph{display:flex;align-items:flex-start;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.ph h1{font-size:22px;line-height:1.3;margin:0;font-weight:600;letter-spacing:-.02em}
.ph p{margin:4px 0 0;color:var(--sub)}
.ph .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.crumb{font-size:13px;color:var(--faint);margin-bottom:6px}
.crumb a{text-decoration:none}
.crumb a:hover{text-decoration:underline}

/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--line2);background:var(--surface);cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--sub)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:var(--surface)}
.btn.pri:hover{background:var(--navy-h)}
.btn.ok{background:var(--s-done);border-color:var(--s-done);color:#fff}
.btn.warn{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.ghost{border-color:transparent;background:none;color:var(--sub)}
.btn.ghost:hover{background:var(--sunk);color:var(--ink)}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:15px;height:15px}
.in,.sel,.ta{width:100%;border:1px solid var(--line2);border-radius:var(--r-sm);background:var(--surface);padding:7px 10px;min-height:34px}
.ta{resize:vertical;min-height:120px;line-height:1.6}
.in:focus,.sel:focus,.ta:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 18%,transparent)}
.in[disabled],.sel[disabled],.ta[disabled],.ta[readonly]{background:var(--sunk);color:var(--sub)}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.fld>label,.lbl{font-size:13px;font-weight:500;color:var(--sub)}
.fld .req::after{content:" *";color:var(--danger)}
.fld .hint{font-size:12px;color:var(--faint)}
.fld.err .in,.fld.err .ta,.fld.err .sel{border-color:var(--danger)}
.fld .emsg{font-size:12px;color:var(--danger)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 16px}
.chk{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:13px}
.chk input{width:16px;height:16px;accent-color:var(--navy)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:var(--r-sm);overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer;font-size:13px;color:var(--sub);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--navy);color:var(--surface)}

/* status */
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 8px 2px 7px;border-radius:4px;white-space:nowrap;color:var(--c);background:color-mix(in srgb,var(--c) 11%,transparent)}
.st::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--c)}
.st.draft{--c:var(--s-draft)}.st.wait{--c:var(--s-wait)}.st.review{--c:var(--s-review)}.st.ask{--c:var(--s-ask)}.st.appr{--c:var(--s-appr)}.st.done{--c:var(--s-done)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 7px;border-radius:4px;border:1px solid var(--line);color:var(--sub);white-space:nowrap;background:var(--surface)}
.tag.hot{border-color:color-mix(in srgb,var(--danger) 40%,var(--line));color:var(--danger)}
.tag.flag{border-style:dashed;border-color:var(--s-wait);color:var(--s-wait)}
.tag.recall{background:var(--danger-soft);color:var(--danger);border-color:transparent;font-weight:500}
.tag.fill{background:var(--sunk);border-color:transparent}
.muted{color:var(--sub)}.faint{color:var(--faint)}.small{font-size:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{flex:1}

/* panels & tables */
.panel{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
.panel-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.panel-h h3{margin:0;font-size:15px;font-weight:600}
.panel-h .note{font-size:12px;color:var(--faint)}
.panel-b{padding:16px 18px}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:500;color:var(--faint);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface);position:sticky;top:0}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--sunk)}
.tbl tr:last-child td{border-bottom:0}
.tbl .id{color:var(--sub);white-space:nowrap}
.tbl .ttl{font-weight:500}
.empty{padding:36px 20px;text-align:center;color:var(--sub)}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:4px}

.subtabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.subtabs button{border:0;background:none;padding:9px 0;cursor:pointer;color:var(--sub);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.subtabs button.on{color:var(--ink);border-color:var(--ink);font-weight:600}
.subtabs .n{font-size:11px;background:var(--sunk);border-radius:8px;padding:0 6px;color:var(--sub);font-weight:500}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;padding:14px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--sunk);margin-bottom:16px}
.filters .f{display:flex;flex-direction:column;gap:4px}
.filters .f label{font-size:12px;color:var(--sub)}
.filters .in,.filters .sel{min-height:32px;padding:5px 8px;width:auto}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin-bottom:22px}
.kpi{padding:16px 18px;border-right:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;border-top:0;border-bottom:0;border-left:0}
.kpi:last-child{border-right:0}
.kpi:hover{background:var(--sunk)}
.kpi .k{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:6px}
.kpi .v{font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1.2;margin-top:6px}
.kpi .v small{font-size:13px;font-weight:400;color:var(--faint);margin-left:4px}
.dash{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px}
.dash>div{display:flex;flex-direction:column;gap:18px;min-width:0}
.list-item{display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.list-item:last-child{border-bottom:0}
.list-item:hover{background:var(--sunk)}
.list-item .main{min-width:0;flex:1}
.list-item .main b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-item .main span{font-size:12px;color:var(--faint)}
.bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--navy);border-radius:4px}

/* request detail */
.req-head{border-bottom:1px solid var(--line);padding:22px 32px 0;background:var(--surface)}
.req-title{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.req-title h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.3}
.req-meta{display:flex;flex-wrap:wrap;gap:6px 22px;margin:12px 0 18px;font-size:13px;color:var(--sub)}
.req-meta b{color:var(--ink);font-weight:500;margin-left:6px}
.track{display:flex;align-items:stretch;margin:4px 0 18px;overflow-x:auto;padding-bottom:2px}
.track .stp{flex:1;min-width:104px;position:relative;padding-top:18px}
.track .stp::before{content:"";position:absolute;top:6px;left:0;right:0;height:2px;background:var(--line)}
.track .stp.past::before{background:var(--ink)}
.track .stp .nd{position:absolute;top:0;left:0;width:14px;height:14px;border-radius:50%;background:var(--surface);border:2px solid var(--line2)}
.track .stp.past .nd{background:var(--ink);border-color:var(--ink)}
.track .stp.cur .nd{border-color:var(--c);background:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 20%,transparent)}
.track .stp .nm{font-size:13px;color:var(--faint);display:block;padding-right:8px}
.track .stp.past .nm{color:var(--sub)}
.track .stp.cur .nm{color:var(--ink);font-weight:600}
.track .stp .ds{font-size:11px;color:var(--faint)}
.track .loop{font-size:11px;color:var(--s-ask);display:block}
.round{display:inline-flex;align-items:baseline;gap:2px;font-weight:700;font-size:13px;border:1.5px solid var(--ink);border-radius:4px;padding:0 6px;line-height:20px}
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:var(--r-md);margin:0 0 16px;border:1px solid color-mix(in srgb,var(--c) 35%,var(--line));background:color-mix(in srgb,var(--c) 7%,var(--surface));--c:var(--s-ask)}
.banner.info{--c:var(--s-review)}.banner.danger{--c:var(--danger)}.banner.done{--c:var(--s-done)}.banner.appr{--c:var(--s-appr)}.banner.wait{--c:var(--s-wait)}
.banner .bt{flex:1;font-size:13px}
.banner .bt b{display:block;font-size:14px;margin-bottom:2px}
.req-body{padding:22px 32px 64px}

.work{display:grid;grid-template-columns:230px minmax(0,1fr) 340px;gap:0;border:1px solid var(--line);border-radius:var(--r-lg);min-height:560px;overflow:hidden}
.work>*{min-width:0}
.clist{border-right:1px solid var(--line);background:var(--sunk);display:flex;flex-direction:column}
.clist-h{padding:12px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);font-size:13px;font-weight:600}
.citem{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.citem:hover{background:color-mix(in srgb,var(--surface) 60%,transparent)}
.citem.on{background:var(--surface);box-shadow:inset 3px 0 0 var(--ink)}
.citem .no{font-size:12px;color:var(--faint);width:26px;flex:none;padding-top:1px}
.citem .ct{flex:1;min-width:0}
.citem .ct b{font-weight:500;font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.citem .ct span{font-size:12px;color:var(--faint)}
.citem .lk{font-size:11px;color:var(--s-ask);display:block}
.clist-f{padding:10px;display:flex;flex-direction:column;gap:6px;margin-top:auto}
.editor{padding:18px 22px;display:flex;flex-direction:column;min-width:0}
.ed-top{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.ed-top h3{margin:0;font-size:16px;font-weight:600}
.save-ind{font-size:12px;color:var(--faint);display:inline-flex;align-items:center;gap:6px}
.save-ind.saving{color:var(--s-review)}.save-ind.fail{color:var(--danger)}.save-ind.saved{color:var(--s-done)}
.lockbar{font-size:12px;padding:8px 12px;border-radius:var(--r-sm);background:var(--mark-soft);margin-bottom:12px}
.counter{font-size:12px;color:var(--faint);text-align:right;margin-top:4px}
.btnrow{border:1px solid var(--line);border-radius:var(--r-md);padding:10px;margin-bottom:8px;display:grid;grid-template-columns:1fr 1.4fr auto;gap:8px;align-items:center}
.card-ed{border:1px solid var(--line);border-radius:var(--r-md);padding:14px;margin-bottom:12px}
.card-ed h4{margin:0 0 10px;font-size:13px;display:flex;align-items:center;gap:8px}
.side-panel{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--surface)}
.sp-tabs{display:flex;border-bottom:1px solid var(--line)}
.sp-tabs button{flex:1;border:0;background:none;padding:11px 4px;cursor:pointer;color:var(--sub);font-size:13px;border-bottom:2px solid transparent;margin-bottom:-1px}
.sp-tabs button.on{color:var(--ink);font-weight:600;border-color:var(--ink)}
.sp-body{padding:14px;overflow:auto;flex:1}

/* proof cards: memorable element */
.proof{border:1px solid var(--line);border-radius:var(--r-md);padding:11px 12px;margin-bottom:8px;cursor:pointer;background:var(--surface);transition:border-color .12s}
.proof:hover{border-color:var(--ink)}
.proof .pl{font-size:11px;color:var(--faint);display:flex;gap:6px;align-items:center;margin-bottom:5px}
.proof .pw{font-size:14px;line-height:1.5}
.proof del{text-decoration:line-through;text-decoration-color:var(--danger);text-decoration-thickness:2px;color:var(--sub)}
.proof ins{text-decoration:none;background:linear-gradient(transparent 55%,var(--mark) 55%);padding:0 2px;font-weight:500}
.proof .pr{font-size:12px;color:var(--sub);margin-top:4px}
.proof .pa{display:flex;gap:4px;margin-top:8px}
.stale{font-size:12px;padding:8px 10px;border-radius:var(--r-sm);background:var(--danger-soft);color:var(--danger);margin-bottom:10px}

/* mockup */
.phone{width:280px;border:1px solid var(--line2);border-radius:28px;padding:10px;background:var(--sunk);margin:0 auto}
.phone-in{background:#B9C6D6;border-radius:20px;min-height:420px;padding:14px 12px;font-size:13px;color:#1b2433;overflow:hidden}
.phone-in.sms{background:#F2F3F5}
.phone .top-t{font-size:11px;text-align:center;color:#4a5566;margin-bottom:10px}
.kk{background:#fff;border-radius:12px;overflow:hidden;max-width:236px}
.kk-h{background:#F5D94A;padding:8px 12px;font-weight:600;font-size:12px}
.kk-b{padding:12px;white-space:pre-wrap;word-break:break-all;line-height:1.55}
.kk-btn{border-top:1px solid #e6e8ec;padding:9px;text-align:center;font-size:12px;background:#f6f7f9;margin:0 10px 8px;border-radius:6px;border:1px solid #e1e4ea}
.var{background:#DDE7FB;color:#1E3F8A;border-radius:3px;padding:0 3px;font-size:.95em}
.bubble{background:#E4E6EA;border-radius:16px;padding:10px 12px;white-space:pre-wrap;word-break:break-all;line-height:1.5;max-width:230px}
.rcs-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.rcs-card{flex:none;width:200px;background:#fff;border-radius:12px;overflow:hidden}
.rcs-img{height:110px;background:repeating-linear-gradient(45deg,#e7eaef 0 8px,#dfe3e9 8px 16px);display:grid;place-items:center;font-size:11px;color:#6b7482}
.rcs-img img{width:100%;height:100%;object-fit:cover}
.rcs-card b{display:block;padding:10px 10px 2px}
.rcs-card p{margin:0;padding:0 10px 10px;white-space:pre-wrap;font-size:12px}
.mock-note{font-size:11px;color:var(--faint);text-align:center;margin-top:10px;line-height:1.5}

/* files */
.file{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px;margin-bottom:8px}
.file .ext{width:38px;height:38px;border-radius:6px;background:var(--sunk);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase}
.file .fr{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.drop{border:1.5px dashed var(--line2);border-radius:var(--r-md);padding:18px;text-align:center;color:var(--sub);font-size:13px;cursor:pointer;display:block}
.drop:hover{border-color:var(--sub)}

/* history */
.hist{position:relative;padding-left:22px}
.hist::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:1px;background:var(--line2)}
.hi{position:relative;padding:0 0 16px}
.hi::before{content:"";position:absolute;left:-20px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--surface);border:2px solid var(--sub)}
.hi.c::before{border-color:var(--s-review);border-radius:2px}
.hi .hl{font-size:13px}
.hi .hl b{font-weight:600}
.hi .hm{font-size:12px;color:var(--faint);display:flex;gap:10px;flex-wrap:wrap;margin-top:1px}
.hi .hd{font-size:13px;color:var(--sub);margin-top:5px;padding:8px 10px;background:var(--sunk);border-radius:var(--r-sm);white-space:pre-wrap}
.rd{display:flex;align-items:center;gap:10px;margin:6px 0 18px -22px;font-size:12px;font-weight:600;color:var(--ink)}
.rd::before,.rd::after{content:"";height:1.5px;background:var(--ink);flex:1}
.rd::before{max-width:14px}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(15,22,35,.36);display:grid;place-items:center;z-index:50;padding:20px}
.modal{background:var(--surface);border-radius:var(--r-lg);width:min(560px,100%);max-height:calc(100% - 20px);display:flex;flex-direction:column;box-shadow:var(--pop)}
.modal.lg{width:min(900px,100%)}
.modal-h{padding:18px 22px 6px;display:flex;align-items:flex-start;gap:10px}
.modal-h h2{margin:0;font-size:18px;font-weight:600;flex:1}
.modal-h p{margin:4px 0 0;font-size:13px;color:var(--sub)}
.modal-b{padding:14px 22px;overflow:auto}
.modal-f{padding:14px 22px 18px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line)}
.pop{position:fixed;z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--pop);width:380px;max-height:70vh;display:flex;flex-direction:column}
.pop-h{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.pop-h b{flex:1}
.pop-b{overflow:auto}
.nt{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.nt:hover{background:var(--sunk)}
.nt .ud{width:7px;height:7px;border-radius:50%;background:var(--focus);flex:none;margin-top:7px}
.nt.read .ud{background:transparent}
.nt .nm{flex:1}
.nt .nm span{display:block;font-size:12px;color:var(--faint);margin-top:2px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--pop);z-index:45;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer-h{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.drawer-h h3{margin:0;font-size:16px;flex:1}
.drawer-b{padding:18px;overflow:auto;flex:1}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:var(--surface);padding:10px 16px;border-radius:var(--r-md);font-size:13px;z-index:60;box-shadow:var(--pop);max-width:90vw}
.pick{border:1px solid var(--line);border-radius:var(--r-md);max-height:260px;overflow:auto}
.pick label{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.pick label:last-child{border-bottom:0}
.pick label:hover{background:var(--sunk)}
.pick .w{margin-left:auto;font-size:12px;color:var(--faint)}
.vitem{display:flex;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center;font-size:13px}
.vitem:hover{background:var(--sunk)}
.qa{border:1px solid var(--line);border-radius:var(--r-md);padding:12px;margin-bottom:10px}
.qa .q{font-size:13px}
.qa .a{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:13px;color:var(--sub)}
.who{font-size:12px;color:var(--faint);margin-bottom:4px;display:flex;gap:8px;align-items:center}

/* login */
.login{min-height:100%;display:grid;grid-template-columns:1fr 1fr;background:var(--surface)}
.login-l{padding:48px 56px;display:flex;flex-direction:column;border-right:1px solid var(--line)}
.login-l h1{font-size:40px;line-height:1.15;letter-spacing:-.035em;margin:auto 0 16px;font-weight:600;max-width:12em}
.login-l p{color:var(--sub);max-width:34em;margin:0 0 auto}
.flow{display:flex;gap:0;margin-top:40px;flex-wrap:wrap}
.flow span{font-size:12px;padding:6px 10px;border:1px solid var(--line2);margin:-1px 0 0 -1px;color:var(--sub)}
.flow span.k{color:var(--ink);border-color:var(--ink);position:relative;z-index:1}
.login-r{padding:48px 56px;display:flex;flex-direction:column;justify-content:center;max-width:560px}
.persona{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:8px;cursor:pointer;background:var(--surface);width:100%;text-align:left}
.persona:hover{border-color:var(--ink)}
.persona .pn{flex:1}
.persona .pn b{display:block;font-weight:600}
.persona .pn span{font-size:12px;color:var(--sub)}

.spec-grp{margin-bottom:24px}
.spec-grp h3{font-size:15px;margin:0 0 8px}
.diff-add{color:var(--s-done)}.diff-del{color:var(--danger);text-decoration:line-through}.diff-chg{color:var(--s-wait)}
.ro-box{padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--sunk)}
.kv{display:grid;grid-template-columns:140px 1fr;gap:8px 16px;font-size:13px}
.kv dt{color:var(--sub)}.kv dd{margin:0}

/* ops: 초기 설정 단계와 배정표 */
.setup-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-left:3px solid var(--line2);border-radius:var(--r-sm)}
.step b{font-size:13px;font-weight:600}
.step>span{grid-column:1;color:var(--sub);font-size:12px}
.step .btn{grid-row:1/3;grid-column:2}
.step.done{border-left-color:var(--s-done)}
.step.done b::after{content:" 완료";color:var(--s-done);font-weight:500;font-size:12px}
.mx td,.mx th{vertical-align:middle}
.mx .cell{display:flex;flex-direction:column;gap:4px;min-width:150px}
.mx .cell .sel{height:30px;min-height:30px;padding:3px 8px;font-size:12px}
.mx .ck{font-size:11px;color:var(--faint)}
.stack>*+*{margin-top:18px}

@media (max-width:1180px){.work{grid-template-columns:200px minmax(0,1fr)}.work .side-panel{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}.dash{grid-template-columns:1fr}}
@media (max-width:860px){
  #app{grid-template-columns:1fr;grid-template-rows:56px 40px 1fr}
  .side{position:fixed;top:0;bottom:0;left:0;width:260px;z-index:48;transform:translateX(-100%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px)}
  body.nav-open .side{transform:none;box-shadow:var(--pop)}
  .top,.tabs,main{grid-column:1}
  .menu-btn{display:grid}
  .ctx select{max-width:120px}
  .ctx .tag,.ctx .slash{display:none}
  .me>span:not(.av),.me em{display:none}
  .page,.req-body{padding:18px 16px 48px}.req-head{padding:18px 16px 0}
  .work{grid-template-columns:1fr}.clist{border-right:0;border-bottom:1px solid var(--line)}
  .grid2,.grid3{grid-template-columns:1fr}
  .login{grid-template-columns:1fr}.login-l{border-right:0;border-bottom:1px solid var(--line);padding:32px 24px}.login-l h1{font-size:30px;margin-top:24px}.login-r{padding:32px 24px}
  .kv{grid-template-columns:1fr}
  .setup-grid{grid-template-columns:1fr}
}

/* ===== design layer v2 ===== */
:root{--brand:#FFD84D;--brand-d:#E8BE1F;--bg:#F2F3F7;--side:#FBFBFD;--navy:#1F2B4D;--navy-h:#2C3C66;--indigo-soft:#EEF1F9;
  --ty-a:#B07A00;--ty-s:#0F7A6E;--ty-r:#6A47B5;--ty-f:#4F5B6E;--lift:0 1px 2px rgba(22,32,58,.05),0 4px 14px rgba(22,32,58,.05)}
body{letter-spacing:-.005em}
.side{background:var(--side)}
.brand{gap:10px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--navy);color:var(--brand);font-size:12px;position:relative;overflow:hidden}
.brand-mark::after{content:"";position:absolute;left:5px;right:5px;bottom:6px;height:3px;border-radius:2px;background:var(--brand);opacity:.9}
.nav button{padding:8px 10px;margin-bottom:1px;font-weight:500}
.nav button svg{color:var(--faint)}
.nav button:hover svg{color:var(--ink)}
.nav button.on{background:var(--navy);color:#fff;font-weight:600}
.nav button.on svg{color:var(--brand)}
.nav button.on .cnt{background:var(--brand);color:var(--navy)}
.nav button .cnt{background:var(--sunk);border-radius:9px;padding:0 7px;line-height:18px;font-size:11px;font-weight:600}
.nav h6{letter-spacing:0}
.side-foot button{border-style:solid;background:var(--surface);display:flex;align-items:center;gap:8px}
.side-foot button::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 30%,transparent)}
.top{box-shadow:0 1px 0 var(--line)}
.ctx select{font-weight:500;background:var(--sunk);border-color:transparent}
.ctx select:hover{border-color:var(--line2)}
.me{border-color:transparent;background:var(--sunk)}
.tabs{padding-top:4px}
.tab{height:34px}
.tab.on{box-shadow:inset 0 2px 0 var(--navy)}
.tab.on::after{content:"";position:absolute;left:10px;right:10px;top:0;height:2px;background:var(--brand)}
main{background:var(--bg)}
.page{padding:30px 36px 72px}
.ph h1{font-size:24px}
.today{font-size:13px;color:var(--sub);margin-bottom:6px;display:inline-flex;align-items:center;gap:8px}
.today::before{content:"";width:18px;height:8px;border-radius:4px;background:var(--brand)}
.hello{font-size:28px!important;letter-spacing:-.03em!important}
.panel{box-shadow:var(--lift);border-color:transparent}
.panel-h{border-bottom-color:var(--line)}
.filters{background:var(--surface);border-color:transparent;box-shadow:var(--lift)}
.btn{border-radius:7px}
.btn.pri{box-shadow:0 1px 0 rgba(0,0,0,.1),inset 0 -2px 0 rgba(0,0,0,.18)}
.btn.ok{box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.st{border-radius:999px;padding:2px 9px 2px 8px}
.st::before{border-radius:50%}
.round{border:0;background:var(--navy);color:var(--brand);border-radius:6px;padding:0 7px;line-height:22px}
/* type chips */
.tychip{display:inline-flex;align-items:center;gap:6px;color:var(--c);font-size:12px;font-weight:500;flex:none}
.tychip svg{width:26px;height:26px;padding:5px;border-radius:7px;background:color-mix(in srgb,var(--c) 12%,var(--surface));flex:none}
.tychip span{color:var(--ink)}
.ty-a{--c:var(--ty-a)}.ty-s{--c:var(--ty-s)}.ty-r{--c:var(--ty-r)}.ty-f{--c:var(--ty-f)}
.req-title .tychip svg{width:34px;height:34px;padding:7px;border-radius:9px}
.clist-h .tychip svg{width:22px;height:22px;padding:4px}
/* avatar stacks */
.avs{display:inline-flex;align-items:center}
.avs .av{box-shadow:0 0 0 2px var(--surface)}
.avs .av+.av{margin-left:-7px}
.av.more{background:var(--sunk);color:var(--sub);width:22px;height:22px;font-size:10px}
.av{font-weight:600}
/* pipeline */
.pipe{background:var(--navy);color:#fff;border-radius:var(--r-lg);padding:18px 20px 12px;margin-bottom:18px;position:relative;overflow:hidden}
.pipe::before{content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;border-radius:50%;border:28px solid rgba(255,216,77,.08)}
.pipe-h{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;position:relative}
.pipe-h b{font-size:15px}.pipe-h span{font-size:13px;color:rgba(255,255,255,.6)}
.pipe-bar{display:flex;gap:3px;height:10px;border-radius:5px;overflow:hidden;background:rgba(255,255,255,.08);position:relative}
.pipe-bar i{display:block;min-width:6px}
.pipe-bar i.draft{background:#8E97AA}.pipe-bar i.wait{background:#E7A93C}.pipe-bar i.review{background:#6E9BFF}.pipe-bar i.ask{background:#FF8A4C}.pipe-bar i.appr{background:#B59CFF}.pipe-bar i.done{background:var(--brand)}
.pipe-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));margin-top:6px;position:relative}
.pipe-s{background:none;border:0;color:inherit;text-align:left;padding:10px 8px 8px 0;cursor:pointer;border-radius:8px}
.pipe-s:hover .pipe-n{color:var(--brand)}
.pipe-n{display:block;font-size:26px;font-weight:600;letter-spacing:-.03em;line-height:1.2}
.pipe-l{font-size:12px;color:rgba(255,255,255,.7);display:inline-flex;align-items:center;gap:6px}
.pipe-l .dot{width:7px;height:7px;border-radius:50%}
.pipe-l .dot.draft{background:#8E97AA}.pipe-l .dot.wait{background:#E7A93C}.pipe-l .dot.review{background:#6E9BFF}.pipe-l .dot.ask{background:#FF8A4C}.pipe-l .dot.appr{background:#B59CFF}.pipe-l .dot.done{background:var(--brand)}
/* kpis */
.kpis{gap:12px;border:0;overflow:visible}
.kpi{border:0!important;border-radius:var(--r-lg);box-shadow:var(--lift);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--c)}
.kpi .kbar{display:block;height:4px;border-radius:2px;background:var(--sunk);margin-top:10px;overflow:hidden}
.kpi .kbar i{display:block;height:100%;background:var(--c);border-radius:2px}
.list-item{gap:12px}
/* request head */
.req-head{position:relative;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 6%,var(--surface)) 0,var(--surface) 120px)}
.req-head::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--c)}
.req-title{align-items:center}
.req-body{background:var(--bg)}
.track .stp::before{height:3px;top:6px;border-radius:2px}
.track .stp .nd{width:15px;height:15px}
.track .stp.past .nd{background:var(--navy);border-color:var(--navy)}
.track .stp.past::before{background:var(--navy)}
.work{background:var(--surface);box-shadow:var(--lift);border-color:transparent}
.citem.on{box-shadow:inset 3px 0 0 var(--brand)}
.proof{border-left:3px solid var(--brand)}
.proof ins{background:linear-gradient(transparent 50%,var(--brand) 50%)}
.banner{border-radius:10px;border-left-width:4px}
.subtabs button.on{border-color:var(--navy)}
.subtabs button.on::after{content:"";}
.seg{border-radius:8px}
.seg button.on{background:var(--navy);color:#fff}
.empty-art{width:120px;height:72px;display:block;margin:0 auto 12px}
.tbl th{background:transparent}
.tbl tr.click:hover td{background:var(--indigo-soft)}
/* login */
.login-l{background:var(--navy);color:#fff;border-right:0;position:relative;overflow:hidden}
.login-l::after{content:"";position:absolute;right:-120px;bottom:-120px;width:420px;height:420px;border-radius:50%;border:60px solid rgba(255,216,77,.07)}
.login-l .brand-mark{background:var(--brand);color:var(--navy)}.login-l .brand-mark::after{background:var(--navy)}
.login-l h1{margin:56px 0 16px;font-size:44px;line-height:1.14;max-width:none}
.login-l p{color:rgba(255,255,255,.7);margin:0}
.login-l .flow{margin-top:auto;position:relative;z-index:1}
.login-l .flow span{color:rgba(255,255,255,.6);border-color:rgba(255,255,255,.2)}
.login-l .flow span.k{color:var(--navy);background:var(--brand);border-color:var(--brand)}
.hero-proof{position:relative;margin:40px 0 40px;max-width:440px;z-index:1}
.hp-card{background:#fff;color:#1B2433;border-radius:14px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.28);position:relative}
.hp-back{position:absolute;inset:-14px 26px 14px -14px;background:rgba(255,255,255,.1);box-shadow:none;transform:rotate(-3deg)}
.hp-l{height:8px;border-radius:4px;background:rgba(255,255,255,.25);margin:10px 0;width:70%}.hp-l.s{width:45%}
.hp-top{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.hp-txt{font-size:15px;line-height:1.75;margin:0!important;color:#1B2433!important}
.hp-txt del{text-decoration-color:#C0392B;text-decoration-thickness:2px;color:#8C95A4}
.hp-txt ins{text-decoration:none;background:linear-gradient(transparent 50%,var(--brand) 50%);font-weight:600;padding:0 2px}
.hp-foot{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid #E1E4EA;font-size:12px;color:#5A6475}
.hp-ok{color:#1B7F5A;font-weight:600}
.persona{border-color:var(--line);transition:border-color .12s}
.persona:hover{border-color:var(--navy);box-shadow:var(--lift)}
@media (max-width:860px){.login-l h1{font-size:32px;margin-top:28px}.hero-proof{margin:28px 0}.page{padding:20px 16px 48px}.hello{font-size:22px!important}}
</style>

<body>
<div id="root"></div>
<div id="ov"></div>
<script>
/* ========== utils ========== */
const NOW = new Date(2026, 8, 21, 14, 0, 0).getTime();
const DAY = 864e5;
const at = (d, h = 10, m = 0) => { const t = new Date(NOW + d * DAY); t.setHours(h, m, 0, 0); return t.getTime(); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ========== dashboard ========== */

    K.push(['진행 중', inP.filter(r => r.by === S.me && ['wait', 'review', 'appr'].includes(r.status)), 'review']);
  }
  if (rs.includes('reviewer')) {
    K.push(['내 검수', inP.filter(r => r.reviewers.includes(S.me) && r.status === 'review'), 'review']);
    K.push(['회수 처리 필요', inP.filter(r => r.primary === S.me && r.recall && r.status === 'review'), 'ask']);
  }
  if (rs.includes('lead')) { K.push(['배정 대기', inP.filter(r => r.status === 'wait'), 'wait']); K.push(['지연', inP.filter(overdue), 'ask']); }
  if (rs.includes('reviewer') || rs.includes('lead')) K.push(['납기 임박', inP.filter(r => dueSoon(r) && (rs.includes('lead') || r.reviewers.includes(S.me))), 'wait']);
  if (rs.includes('approver')) K.push(['승인 대기', inP.filter(r => can.approve(r)), 'appr']);
  if (adm) { const allC = S.requests.filter(r => P(r.pid).cid === S.cid && canView(r));
    K.push(['고객사 진행 중', allC.filter(r => !isFinal(r) && r.status !== 'draft'), 'review']);
    K.push(['고객사 완료', allC.filter(isFinal), 'done']); }
  UI.kpi = K;
  const todo = [];
  inP.forEach(r => {

    if (can.complete(r) && r.primary === S.me) todo.push([r, '검수 완료 처리 (주담당)', 'review']);
    else if (can.review(r) && !r.recall) todo.push([r, '검수 진행', 'review']);
    if (can.approve(r)) todo.push([r, '최종 승인', 'appr']);
    if (r.status === 'draft' && r.by === S.me) todo.push([r, '작성 이어하기', 'draft']);
  });
  const notices = visibleNotices().slice(0, 4);
  const leadBox = rs.includes('lead') ? `<div class="panel"><div class="panel-h"><h3>검수자별 업무량</h3><span class="note">검수 중, 확인 요청, 승인 대기 기준</span></div><div class="panel-b">${workloadRows(pid, true)}</div></div>` : '';
  const admBox = adm && !isMember(pid) ? `<div class="banner info"><div class="bt"><b>고객사 관리자 권한으로 보고 있습니다</b>소속 고객사의 모든 프로젝트를 조회할 수 있지만 검수와 최종 승인은 관리 권한으로 처리할 수 없습니다. 다른 요청자가 작성 중인 요청은 보이지 않습니다.</div><button class="btn sm" data-a="nav" data-r="users" data-sub="grants">접근 기록 보기</button></div>` : '';
  return `<div class="page"><div class="ph"><div><div class="today">9월 21일 월요일</div><h1 class="hello">${esc(me().name)}님, 오늘 처리할 업무입니다</h1><p>${esc(P(pid)?.name || '')} 프로젝트 기준입니다. ${flag('역할별 지표 확정 전 (A-6)')}</p></div>
  <div class="acts">${rs.includes('requester') ? `<button class="btn pri" data-a="newReq">${IC.plus}새 요청</button>` : ''}</div></div>
  ${admBox}
  ${vPipe(inP)}
  ${K.length ? `<div class="kpis">${K.map(([k, list, c], i) => `<button class="kpi" data-a="kpi" data-k="${i}" style="--c:var(--s-${c})"><span class="k">${k}</span><div class="v">${list.length}<small>건</small></div><span class="kbar"><i style="width:${Math.min(100, list.length * 20)}%"></i></span></button>`).join('')}</div>` : ''}
  <div class="dash"><div>
    <div class="panel"><div class="panel-h"><h3>지금 처리할 일</h3><span class="note">${todo.length}건</span></div>
    ${todo.length ? todo.slice(0, 8).map(([r, a, c]) => `<div class="list-item" data-a="openReq" data-id="${r.id}">${tyChip(r.type)}<span class="st ${c}" style="width:auto">${a}</span><div class="main"><b>${esc(r.title || '제목 없는 요청')}</b><span>${reqRowMeta(r)}  납기 ${fD(r.due)}</span></div>${overdue(r) ? '<span class="tag hot">지연</span>' : dueSoon(r) ? '<span class="tag hot">납기 임박</span>' : ''}</div>`).join('') : empty('처리할 일이 없습니다', '새 업무가 생기면 알림으로 알려드립니다.')}</div>
    <div class="panel"><div class="panel-h"><h3>프로젝트 최근 요청</h3><button class="btn sm ghost" data-a="nav" data-r="requests" style="margin-left:auto">전체 보기</button></div>
    ${inP.length ? inP.slice().sort((a, b) => (b.submitted || b.created) - (a.submitted || a.created)).slice(0, 6).map(r => `<div class="list-item" data-a="openReq" data-id="${r.id}">${tyChip(r.type)}${st(r.status)}<div class="main"><b>${esc(r.title || '제목 없는 요청')}</b><span>${esc(r.id)}  ${esc(r.type)}  ${esc(U(r.by).name)}</span></div><span class="small faint">${fD(r.due)}</span></div>`).join('') : empty('볼 수 있는 요청이 없습니다')}</div>
  </div><div>
    ${leadBox}
    <div class="panel"><div class="panel-h"><h3>공지</h3><button class="btn sm ghost" data-a="nav" data-r="notices" style="margin-left:auto">전체</button></div>

  </div></div></div>`;
}
/* 솔루션 운영 담당자 대시보드. 콘텐츠 지표가 아니라 운영 상태를 본다 */

  const todo = [...noAdmin.map(x => [x.c, '고객사 관리자 초대', 'opsSeed']), ...noProj.map(x => [x.c, '초기 프로젝트 생성', 'opsSeed']), ...unassigned.map(x => [x.c, `유효 데이터셋 ${x.d.unassigned.length}개 조합 배정`, 'standards'])];
  return `<div class="page"><div class="ph"><div><div class="today">9월 21일 월요일</div><h1 class="hello">${esc(me().name)}님, 운영 현황입니다</h1>
  <p>솔루션 운영 담당자는 고객사 초기 설정과 콘텐츠 유형·교정 기준을 운영합니다. 고객사 콘텐츠는 지원 접근을 받은 기간에만 볼 수 있습니다. ${flag('운영 전용 대시보드 범위 협의 07')}</p></div>
  <div class="acts"><button class="btn pri" data-a="opsCustNew">${IC.plus}고객사 생성</button></div></div>
  <div class="kpis">${K.map(([k, v, c]) => `<div class="kpi" style="--c:var(--s-${c});cursor:default"><span class="k">${k}</span><div class="v">${v}<small>건</small></div><span class="kbar"><i style="width:${Math.min(100, v * 25)}%"></i></span></div>`).join('')}</div>
  <div class="dash"><div>
    <div class="panel"><div class="panel-h"><h3>초기 설정에서 남은 일</h3><span class="note">${todo.length}건</span></div>
    ${todo.length ? todo.map(([c, a, r]) => `<div class="list-item" data-a="nav" data-r="${r}" data-sub="${r === 'standards' ? 'assign' : ''}"><span class="st wait" style="width:auto">${esc(a)}</span><div class="main"><b>${esc(c.name)}</b><span>${esc(c.domain)}  ${c.approval ? '승인 단계 사용' : '승인 단계 미사용'}</span></div></div>`).join('') : empty('초기 설정이 모두 끝났습니다', '새 고객사를 만들면 여기에 남은 단계가 표시됩니다.')}</div>

    ${stats.map(({ c, d }) => `<div class="list-item" data-a="nav" data-r="opsCust"><div class="main"><b>${esc(c.name)}${c.active === false ? ' (비활성)' : ''}</b><span>프로젝트 ${d.ps.length}  사용자 ${d.users.length}  진행 중 요청 ${d.live.length}</span></div>${d.unassigned.length ? `<span class="tag hot">미배정 ${d.unassigned.length}</span>` : '<span class="tag">배정 완료</span>'}</div>`).join('')}</div>

    <button class="btn sm" style="margin-top:12px" data-a="nav" data-r="opsCust">접근 부여</button></div></div>

function vPipe(list) {
  const appr = Cu(S.cid).approval;
  const keys = ['draft', 'wait', 'review', 'ask', ...(appr ? ['appr', 'approved'] : ['done'])];
  const cnt = k => list.filter(r => r.status === k && !(k === 'draft' && r.by !== S.me)).length;
  const tot = keys.reduce((a, k) => a + cnt(k), 0) || 1;
  UI.pipe = keys.map(k => [ST[k].l, list.filter(r => r.status === k && !(k === 'draft' && r.by !== S.me))]);
  return `<section class="pipe" aria-label="프로젝트 요청 흐름"><div class="pipe-h"><b>${esc(P(S.pid)?.name || '')} 요청 흐름</b><span>${list.length}건</span></div>
  <div class="pipe-bar">${keys.map(k => cnt(k) ? `<i class="${ST[k].c}" style="flex:${cnt(k) / tot}"></i>` : '').join('')}</div>
  <div class="pipe-steps">${keys.map((k, i) => `<button class="pipe-s" data-a="pipe" data-k="${i}"><span class="pipe-n">${cnt(k)}</span><span class="pipe-l"><i class="dot ${ST[k].c}"></i>${ST[k].l}</span></button>`).join('')}</div></section>`;
}
function workloadRows(pid, compact) {
  const rv = reviewersOf(pid); const act = S.requests.filter(r => r.pid === pid && ['review', 'ask', 'appr'].includes(r.status));
  const rows = rv.map(u => {
    const mine = act.filter(r => r.reviewers.includes(u));
    const chars = mine.reduce((s, r) => s + r.contents.reduce((a, c) => a + (c.files.length ? 0 : textFields(r.type, c.f).reduce((x, [, t]) => x + (t || '').length, 0)), 0), 0);
    const units = {}; mine.forEach(r => r.contents.forEach(c => c.files.forEach(f => units[f.unit] = (units[f.unit] || 0) + (+f.rangeN || 0))));
    return { u, n: mine.length, pr: mine.filter(r => r.primary === u).length, chars, units, due: mine.filter(r => dueSoon(r) || overdue(r)).length };
  });
  const max = Math.max(1, ...rows.map(r => r.n));
  if (compact) return rows.map(x => `<div class="row" style="margin-bottom:12px">${av(x.u, 24)}<span style="width:56px">${esc(U(x.u).name)}</span><div class="bar" style="flex:1"><i style="width:${x.n / max * 100}%"></i></div><span class="small" style="width:40px;text-align:right">${x.n}건</span></div>`).join('') || '<span class="muted">검수자가 없습니다</span>';
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>검수자</th><th>활성 요청</th><th>주담당</th><th>납기 임박·지연</th><th>문안 글자 수</th><th>파일 실제 검수 범위</th><th style="width:30%">부하</th></tr></thead><tbody>
  ${rows.map(x => `<tr><td><span class="row">${av(x.u, 22)}${esc(U(x.u).name)}</span></td><td>${x.n}</td><td>${x.pr}</td><td>${x.due}</td><td>${x.chars.toLocaleString()}자</td><td>${Object.entries(x.units).map(([k, v]) => `<span class="tag">${k} ${v}</span>`).join(' ') || '<span class="faint">-</span>'}</td><td><div class="bar"><i style="width:${x.n / max * 100}%"></i></div></td></tr>`).join('')}</tbody></table></div>
  <p class="small faint" style="margin:10px 0 0">파일 검수량은 파일 건수가 아니라 실제 검수 범위로 표시하며, 단위가 다르면 합산하지 않습니다.</p>`;
}

/* ========== request detail ========== */

      <span>희망 납기<b>${fD(r.hopeDue)}</b></span><span>확정 납기<b>${fD(r.due)}${overdue(r) ? ' (지연)' : ''}</b></span>${r.submitted ? `<span>접수<b>${fDT(r.submitted)}</b></span>` : ''}</div>
    ${vTrack(r)}
    <div class="subtabs" style="margin-bottom:0">${[['contents', `콘텐츠 <span class="n">${r.contents.length}</span>`], ['info', '요청 정보'], ['hist', `히스토리 <span class="n">${r.hist.length}</span>`], ...(isFinal(r) ? [['result', '완료 결과']] : [])].map(([k, l]) => `<button class="${t.sub === k ? 'on' : ''}" data-a="sub" data-k="${k}">${l}</button>`).join('')}</div>
  </div>
  <div class="req-body">${vBanners(r, nAsk)}${t.sub === 'contents' ? vWork(tab, r) : t.sub === 'info' ? vInfo(tab, r) : t.sub === 'hist' ? vHist(tab, r) : vResult(tab, r)}</div>`;

function vTrack(r) {
  const appr = custOf(r).approval;
  const steps = ['draft', 'wait', 'review', ...(appr ? ['appr', 'approved'] : ['done'])];
  const cur = r.status === 'ask' ? 'review' : r.status;
  const ci = steps.indexOf(cur);
  const when = k => { const m = { draft: '요청 작성', wait: '검수 요청', review: '검수자 배정', appr: '검수 완료', approved: '승인 완료', done: '검수 완료' }[k]; const h = r.hist.filter(x => x.act === m).pop(); return h ? fDT(h.at) : ''; };
  const asks = r.asks.length;
  return `<div class="track" role="list" aria-label="요청 진행 단계">${steps.map((k, i) => {

    return `<div class="stp ${cls}" role="listitem" style="--c:${color}"><span class="nd"></span><span class="nm">${r.status === 'ask' && k === 'review' ? '확인 요청 중' : ST[k].l}</span>${k === 'review' && asks ? `<span class="loop">확인 요청 ${asks}회</span>` : ''}<span class="ds">${i <= ci ? when(k) : ''}</span></div>`;
  }).join('')}</div>`;
}
function vBanners(r, nAsk) {

  if (r.status === 'wait') out.push(B('wait', '대표 검수자의 배정을 기다리고 있습니다', r.by === S.me ? '검수자가 배정되기 전에는 요청을 바로 취소할 수 있습니다.' : '대표 검수자가 검수자와 주담당을 지정하면 검수가 시작됩니다.'));
  if (r.status === 'ask') out.push(r.by === S.me ? B('', '검수자가 확인을 요청했습니다', '답변을 보내면 검수가 다시 시작됩니다. 답변하는 동안 본인 콘텐츠를 수정할 수 있습니다.', `<button class="btn sm" data-a="spTab" data-k="ask">답변하기</button>`) : B('', '요청자 답변을 기다리고 있습니다', '확인 요청 중에는 요청 전체의 검수가 멈추고, 회수 요청과 검수자 변경을 할 수 없습니다.'));

    : B('danger', '회수 요청 처리 중입니다', `주담당 검수자 ${esc(U(r.primary).name)}님이 승인 또는 거절합니다. 처리 전까지 요청자는 편집할 수 없습니다.`));

/* review */
function vReview(tab) {
  const lead = hasRole(S.pid, 'lead'), rev = hasRole(S.pid, 'reviewer');
  const t = tab.st; t.sub = t.sub || (lead ? 'assign' : 'mine');
  const tabs = [...(rev ? [['mine', '내 검수']] : []), ...(lead ? [['assign', '배정 관리']] : [])];
  let body = '';
  if (t.sub === 'mine') {
    const f = t.mf || 'active';
    const list = S.requests.filter(r => r.pid === S.pid && r.reviewers.includes(S.me) && (f === 'active' ? !isFinal(r) : isFinal(r)));
    body = `<div class="seg" style="margin-bottom:14px"><button class="${f === 'active' ? 'on' : ''}" data-a="mf" data-k="active">진행 중</button><button class="${f === 'done' ? 'on' : ''}" data-a="mf" data-k="done">완료</button></div>
    <div class="panel"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>요청 ID</th><th>제목</th><th>상태</th><th>내 역할</th><th>차수</th><th>검수량</th><th>확정 납기</th></tr></thead><tbody>
    ${list.map(r => `<tr class="click" data-a="openReq" data-id="${r.id}"><td class="id">${r.id}</td><td class="ttl">${esc(r.title)}${r.recall ? ' <span class="tag recall">회수 요청됨</span>' : ''}</td><td>${st(r.status)}</td><td>${r.primary === S.me ? '<b style="font-weight:600">주담당</b>' : '공동 검수'}</td><td>${r.round}차</td><td>${volume(r)}</td><td>${fD(r.due)} ${overdue(r) ? '<span class="tag hot">지연</span>' : dueSoon(r) ? '<span class="tag hot">임박</span>' : ''}</td></tr>`).join('')}
    </tbody></table></div>${list.length ? '' : empty('해당하는 검수 요청이 없습니다')}</div>`;
  } else {
    const inP = S.requests.filter(r => r.pid === S.pid);
    const sec = (title, list, btn) => `<div class="panel"><div class="panel-h"><h3>${title}</h3><span class="note">${list.length}건</span></div>${list.length ? list.map(r => `<div class="list-item" data-a="openReq" data-id="${r.id}">${st(r.status)}<div class="main"><b>${esc(r.title)}</b><span>${r.id}  ${esc(U(r.by).name)}  희망 ${fD(r.hopeDue)}  확정 ${fD(r.due)}  ${r.urg}</span></div>${btn ? `<button class="btn sm pri" data-a="assignFrom" data-id="${r.id}">배정</button>` : `<span class="small faint">${names(r.reviewers)}</span>`}</div>`).join('') : `<div class="empty" style="padding:18px">없음</div>`}</div>`;
    body = `<div class="grid3" style="gap:16px;margin-bottom:18px;align-items:start">${sec('배정 대기', inP.filter(r => r.status === 'wait'), 1)}${sec('지연', inP.filter(overdue))}${sec('납기 임박', inP.filter(dueSoon))}</div>
    <div class="panel"><div class="panel-h"><h3>검수자별 활성 요청과 업무량</h3>${flag('글자 수 산정, 납기 임박 기준 협의')}</div><div class="panel-b">${workloadRows(S.pid)}</div></div>`;
  }
  return `<div class="page wide"><div class="ph"><div><h1>검수</h1><p>${esc(P(S.pid).name)} 프로젝트. ${lead ? '대표 검수자로서 배정 대기 요청에 검수자를 배정하고 주담당을 지정합니다.' : '배정된 요청을 검수합니다.'}</p></div></div>
  <div class="subtabs">${tabs.map(([k, l]) => `<button class="${t.sub === k ? 'on' : ''}" data-a="sub" data-k="${k}">${l}</button>`).join('')}</div>${body}</div>`;
}
function volume(r) {
  const chars = r.contents.reduce((a, c) => a + (c.files.length ? 0 : textFields(r.type, c.f).reduce((x, [, t]) => x + (t || '').length, 0)), 0);
  const fl = r.contents.flatMap(c => c.files).map(f => `${f.unit} ${f.rangeN || '?'}`);
  return [chars ? chars.toLocaleString() + '자' : '', ...fl].filter(Boolean).join(', ');
}

/* content archive */
function lineKey(r, cid) { if (r.parent) { const pr = Rq(r.parent.req); if (pr) return lineKey(pr, r.parent.cid); } return r.id + ':' + cid; }
function vContents(tab) {
  const f = tab.st.f || (tab.st.f = { q: '', type: '', camp: '', from: '', to: '', status: '' });
  const reqs = S.requests.filter(r => r.pid === S.pid && canView(r));
  const groups = {};
  reqs.filter(isFinal).forEach(r => { if (!r.public && r.by !== S.me) return; r.bundle.items.forEach(it => { const k = lineKey(r, it.cid); (groups[k] = groups[k] || []).push({ r, it }); }); });
  const q = f.q.trim().toLowerCase();
  let gs = Object.entries(groups).map(([k, arr]) => ({ k, arr: arr.sort((a, b) => b.r.bundle.at - a.r.bundle.at) }));
  gs = gs.filter(({ arr }) => { const { r, it } = arr[0]; const txt = (it.title + textFields(r.type, it.f).map(x => x[1]).join(' ') + it.files.map(x => x.name).join(' ') + r.title).toLowerCase();
    return (!q || txt.includes(q)) && (!f.type || r.type === f.type) && (!f.camp || r.campaign === f.camp) && (!f.status || r.status === f.status) && (!f.from || r.bundle.at >= pISO(f.from) - DAY) && (!f.to || r.bundle.at <= pISO(f.to)); });
  gs.sort((a, b) => b.arr[0].r.bundle.at - a.arr[0].r.bundle.at);
  const camps = uniq(reqs.map(r => r.campaign).filter(Boolean));
  const follow = k => reqs.filter(r => !isFinal(r) && r.parent && lineKey(Rq(r.parent.req), r.parent.cid) === k);
  const open = tab.st.open || (tab.st.open = {});
  return `<div class="page wide"><div class="ph"><div><h1>콘텐츠</h1><p>검수 완료 또는 승인 완료된 콘텐츠를 보관합니다. 같은 콘텐츠의 최신 완료본을 먼저 보여주고, 과거 완료본과 후속 요청을 펼쳐 볼 수 있습니다.</p></div></div>
  <div class="filters"><div class="f" style="flex:1;min-width:220px"><label>문안, 파일명, 본문</label><input class="in" style="width:100%" data-i="flt" data-k="q" value="${esc(f.q)}" placeholder="검색어"></div>
  <div class="f"><label>유형</label><select class="sel" data-i="flt" data-k="type"><option value="">전체</option>${TYPES.map(x => `<option ${f.type === x ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
  <div class="f"><label>캠페인</label><select class="sel" data-i="flt" data-k="camp"><option value="">전체</option>${camps.map(x => `<option ${f.camp === x ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></div>
  <div class="f"><label>요청 상태</label><select class="sel" data-i="flt" data-k="status"><option value="">전체</option><option value="done" ${f.status === 'done' ? 'selected' : ''}>검수 완료</option><option value="approved" ${f.status === 'approved' ? 'selected' : ''}>승인 완료</option></select></div>
  <div class="f"><label>완료일</label><div class="row" style="flex-wrap:nowrap"><input type="date" class="in" data-i="flt" data-k="from" value="${f.from}"><span class="faint">~</span><input type="date" class="in" data-i="flt" data-k="to" value="${f.to}"></div></div>
  <button class="btn ghost sm" data-a="fltReset" style="margin-bottom:3px">초기화</button></div>
  <div class="panel">${gs.map(({ k, arr }) => { const { r, it } = arr[0]; const fu = follow(k); const o = open[k];
    return `<div class="list-item" style="cursor:default;align-items:flex-start;flex-wrap:wrap"><div class="main" style="min-width:240px"><b>${esc(it.title)}  <span class="faint" style="font-weight:400">v${it.v}</span>${r.public ? '' : ' <span class="tag">비공개</span>'}</b>
      <span>${r.id}  ${r.type}  ${ST[r.status].l}  ${fD(r.bundle.at)}${r.campaign ? '  ' + esc(r.campaign) : ''}</span>
      <div class="small" style="margin-top:6px;color:var(--sub);white-space:pre-wrap;max-width:720px">${it.files.length ? it.files.map(x => esc(x.name) + ' (v' + x.v + ')').join(', ') : renderVars((textFields(r.type, it.f)[0]?.[1] || '').slice(0, 140))}</div>
      ${o ? `<div style="margin-top:10px">${arr.slice(1).map(x => `<div class="small" style="padding:6px 0;border-top:1px dashed var(--line)">과거 완료본  <a href="#/request/${x.r.id}" data-a="openReq" data-id="${x.r.id}">${x.r.id}</a>  ${esc(x.r.title)}  v${x.it.v}  ${fD(x.r.bundle.at)}</div>`).join('')}${fu.map(x => `<div class="small" style="padding:6px 0;border-top:1px dashed var(--line)">후속 요청  <a href="#/request/${x.id}" data-a="openReq" data-id="${x.id}">${x.id}</a>  ${st(x.status)}  ${esc(x.title || '제목 없음')}</div>`).join('')}${arr.length === 1 && !fu.length ? '<div class="small faint">연결된 과거 완료본이나 후속 요청이 없습니다.</div>' : ''}</div>` : ''}</div>
      <div class="row">${arr.length > 1 || fu.length ? `<button class="btn sm ghost" data-a="lineToggle" data-k="${k}">${o ? '접기' : `이력 ${arr.length - 1 + fu.length}`}</button>` : `<button class="btn sm ghost" data-a="lineToggle" data-k="${k}">이력</button>`}
      ${it.files.length ? '' : `<button class="btn sm" data-a="copyArch" data-id="${r.id}" data-cid="${it.cid}">${IC.copy}복사</button>`}<button class="btn sm" data-a="openC2" data-id="${r.id}" data-cid="${it.cid}">${IC.ext}새 탭</button>${hasRole(S.pid, 'requester') ? `<button class="btn sm" data-a="followUp2" data-id="${r.id}" data-cid="${it.cid}">후속 요청</button>` : ''}</div></div>`; }).join('') || empty('보관된 완료 콘텐츠가 없습니다', '요청이 최종 완료되면 이곳에 쌓입니다.')}</div></div>`;
}

/* perf */
function vPerf(tab) {
  const f = tab.st.f || (tab.st.f = { period: '30', pid: S.pid, user: '' });
  const from = f.period === 'm' ? new Date(2026, 8, 1).getTime() : NOW - (+f.period) * DAY;
  const projs = myProjects().filter(p => hasRole(p.id, 'lead') || isAdmin(p.cid));
  const pids = f.pid === 'all' ? projs.map(p => p.id) : [f.pid];
  /* 시연용 샘플은 실적 집계에서 제외한다 (기획서 18.4) */
  const reqs = S.requests.filter(r => pids.includes(r.pid) && !r.demo);
  const received = reqs.filter(r => r.submitted && r.submitted >= from && r.submitted <= NOW);
  const recDone = received.filter(isFinal);
  const doneIn = reqs.filter(r => r.bundle && r.bundle.at >= from);
  const rate = received.length ? Math.round(recDone.length / received.length * 100) : 0;
  const people = uniq(pids.flatMap(p => reviewersOf(p)));
  const rows = people.filter(u => !f.user || u === f.user).map(u => ({
    u, done: reqs.filter(r => r.bundle && r.bundle.at >= from && r.hist.some(h => h.by === u && h.act === '검수 완료')).length,
    co: reqs.filter(r => r.bundle && r.bundle.at >= from && r.reviewers.includes(u)).length,
    asg: reqs.reduce((a, r) => a + r.hist.filter(h => h.by === u && ['검수자 배정', '검수자 변경'].includes(h.act) && h.at >= from).length, 0),
    act: reqs.filter(r => r.reviewers.includes(u) && ['review', 'ask', 'appr'].includes(r.status)).length
  }));
  const max = Math.max(1, ...rows.map(x => x.done + x.co));
  return `<div class="page wide"><div class="ph"><div><h1>업무량·실적</h1><p>고유 요청 수와 콘텐츠 수를 나눠 집계합니다. 접수 집단 완료율과 기간 내 완료량은 서로 다른 지표입니다.</p></div><div class="acts">${flag('완료율 분모, 기간 경계, 시간대 협의')}</div></div>
  <div class="filters"><div class="f"><label>기간</label><select class="sel" data-i="flt" data-k="period"><option value="m" ${f.period === 'm' ? 'selected' : ''}>이번 달</option><option value="30" ${f.period === '30' ? 'selected' : ''}>최근 30일</option><option value="90" ${f.period === '90' ? 'selected' : ''}>최근 90일</option></select></div>
  <div class="f"><label>프로젝트</label><select class="sel" data-i="flt" data-k="pid">${projs.map(p => `<option value="${p.id}" ${f.pid === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}<option value="all" ${f.pid === 'all' ? 'selected' : ''}>권한 있는 전체</option></select></div>
  <div class="f"><label>사용자</label><select class="sel" data-i="flt" data-k="user"><option value="">전체</option>${people.map(u => `<option value="${u}" ${f.user === u ? 'selected' : ''}>${esc(U(u).name)}</option>`).join('')}</select></div></div>
  <div class="kpis" style="cursor:default"><div class="kpi" style="cursor:default"><span class="k">접수 요청</span><div class="v">${received.length}<small>건, 콘텐츠 ${received.reduce((a, r) => a + r.contents.length, 0)}건</small></div></div>
  <div class="kpi" style="cursor:default"><span class="k">접수 집단 완료율</span><div class="v">${rate}<small>% (${recDone.length}/${received.length})</small></div></div>
  <div class="kpi" style="cursor:default"><span class="k">기간 내 완료량</span><div class="v">${doneIn.length}<small>건, 콘텐츠 ${doneIn.reduce((a, r) => a + r.contents.length, 0)}건</small></div></div>
  <div class="kpi" style="cursor:default"><span class="k">현재 진행</span><div class="v">${reqs.filter(r => ['wait', 'review', 'ask', 'appr'].includes(r.status)).length}<small>건</small></div></div></div>
  <div class="panel" style="margin-bottom:18px"><div class="panel-h"><h3>개인 실적</h3><span class="note">검수 완료는 주담당 처리 건, 배정·관리는 대표 검수자 활동</span></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>사용자</th><th>검수 완료 처리</th><th>공동 검수 참여</th><th>배정·관리</th><th>현재 활성</th><th style="width:28%"></th></tr></thead><tbody>
  ${rows.map(x => `<tr><td><span class="row">${av(x.u, 22)}${esc(U(x.u).name)}</span></td><td>${x.done}</td><td>${x.co}</td><td>${x.asg}</td><td>${x.act}</td><td><div class="bar"><i style="width:${(x.done + x.co) / max * 100}%"></i></div></td></tr>`).join('')}</tbody></table></div></div>
  <div class="panel"><div class="panel-h"><h3>현재 업무량</h3></div><div class="panel-b">${workloadRows(pids[0])}</div></div></div>`;
}

/* admin: projects */

  <div class="subtabs">${tabs.map(([k, l]) => `<button class="${t.sub === k ? 'on' : ''}" data-a="sub" data-k="${k}">${l}${PH2[k] ? ' <span class="tag flag" style="margin-left:4px">후속</span>' : ''}</button>`).join('')}</div>${ph2}${body}</div>`;

/* E-7.1 고객사 x 유형 유효 데이터셋 배정표, E-8.1 조합별 1개 연결 */
function vAssign(t) {
  const cols = ['공통', ...TYPES];
  const rows = S.customers.map(c => {
    const cells = cols.map(ty => {
      const list = S.datasets.filter(d => d.type === ty && d.status === 'deployed').sort((a, b) => b.v - a.v);
      const a = assignOf(c.id, ty); const cur = a && S.datasets.find(d => d.id === a.dsId);
      const tyOff = ty !== '공통' && !S.types.find(x => x.k === ty)?.active;
      return `<td><div class="cell"><select class="sel" data-i="asSet" data-cid="${c.id}" data-ty="${ty}" ${tyOff ? 'disabled title="사용하지 않는 유형입니다"' : ''}>
      <option value="">미배정</option>${list.map(d => `<option value="${d.id}" ${cur?.id === d.id ? 'selected' : ''}>v${d.v}  규칙 ${d.rules.length}개</option>`).join('')}</select>
      ${cur ? `<span class="ck">${a.checkedAt ? `${fD(a.checkedAt)} 확인  ${esc(U(a.checkedBy).name)}` : '<span style="color:var(--s-wait)">확인 전</span>'}</span>${a.checkedAt ? '' : `<button class="btn sm ghost" data-a="asConfirm" data-id="${a.id}" style="align-self:flex-start">확인 처리</button>`}` : '<span class="ck">연결된 기준이 없습니다</span>'}</div></td>`;
    }).join('');
    const miss = cols.filter(ty => !assignOf(c.id, ty) && (ty === '공통' || S.types.find(x => x.k === ty)?.active));
    return `<tr><td class="ttl">${esc(c.name)}${c.active === false ? ' <span class="tag hot">비활성</span>' : ''}<div class="small faint">${miss.length ? `미배정 ${miss.length}개` : '배정 완료'}</div></td>${cells}</tr>`;
  }).join('');
  const eff = ['공통', ...TYPES];
  return `<div class="panel" style="margin-bottom:18px"><div class="panel-h"><h3>고객사 × 콘텐츠 유형 배정</h3><span class="note">조합마다 유효 데이터셋 하나만 연결합니다</span></div>
  <div class="tbl-wrap"><table class="tbl mx"><thead><tr><th>고객사</th>${eff.map(x => `<th>${x}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div></div>
  <div class="panel"><div class="panel-h"><h3>${esc(Cu(S.cid).name)} 텍스트 교정에 실제 적용되는 기준</h3></div><div class="panel-b">
  ${TYPES.map(ty => { const e = effectiveRules(ty, S.cid); const off = !S.types.find(x => x.k === ty)?.active;

  <p class="small faint" style="margin-bottom:0">배정하지 않은 조합은 최근 배포본으로 검사하며 결과 카드에 배정 전 기본값으로 표시됩니다. 실제 개발에서는 배정 없이 교정을 실행할지 먼저 정해야 합니다. ${flag('기준 연결과 적용 시점 협의 15')}</p></div></div>`;
}
/* E-10.2 공통 운영·기준 변경 공지 (후속) */

  const list = S.notices.filter(n => n.scope === 'common' || n.scope === 'standard').sort((a, b) => b.at - a.at);
  return `<div class="panel"><div class="panel-h"><h3>공통 운영 공지와 기준 변경 공지</h3><span class="note">읽기 전용</span></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>제목</th><th>범위</th><th>연결된 배포 묶음</th><th>작성</th><th>상태</th></tr></thead><tbody>
  ${list.map(n => `<tr><td class="ttl">${esc(n.title)}<div class="small muted">${esc(n.body)}</div></td><td>${scopeLabel(n)}</td><td>${n.bundle ? `<span class="tag">${esc(n.bundle)}</span>` : '<span class="faint">-</span>'}</td><td>${esc(U(n.by).name)}  ${fD(n.at)}</td><td>${n.withdrawn ? '<span class="tag hot">철회</span>' : '<span class="tag">게시</span>'}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">공지가 없습니다.</td></tr>'}</tbody></table></div>
  <div class="panel-b"><p class="small faint" style="margin:0">기준 변경 공지는 실제 배포 묶음과 적용 시점에 연결합니다. 고객사·프로젝트 공지는 고객사 관리자의 공지 관리에서 작성합니다.</p></div></div>`;
}
const tySel = (t, withCommon) => `<div class="seg" style="margin-bottom:16px">${(withCommon ? ['공통', ...TYPES] : TYPES).map(x => `<button class="${t.ty === x ? 'on' : ''}" data-a="ty" data-k="${x}">${x}</button>`).join('')}</div>`;
function vDataset(t) {
  const list = S.datasets.filter(d => d.type === t.ty).sort((a, b) => b.v - a.v);
  const sel = list.find(d => d.id === t.ds) || list[0]; if (sel) t.ds = sel.id;
  const dep = list.find(d => d.status === 'deployed');
  const draft = sel?.status === 'draft';
  const eff = t.ty === '공통' ? null : effectiveRules(t.ty, S.cid);
  let diff = '';
  if (t.showDiff && sel && dep && sel.id !== dep.id) {
    const a = new Map(dep.rules.map(r => [r.p, r])), b = new Map(sel.rules.map(r => [r.p, r]));
    const rows = [];
    b.forEach((r, k) => { if (!a.has(k)) rows.push(`<div class="diff-add">추가  ${esc(r.p)} > ${esc(r.s)}</div>`); else if (a.get(k).s !== r.s) rows.push(`<div class="diff-chg">변경  ${esc(k)}: ${esc(a.get(k).s)} > ${esc(r.s)}</div>`); });
    a.forEach((r, k) => { if (!b.has(k)) rows.push(`<div class="diff-del">삭제  ${esc(r.p)} > ${esc(r.s)}</div>`); });

function onFile(el) {

    const rd = new FileReader(); rd.onload = () => setField(`cards.${el.dataset.img}.img`, rd.result, true); rd.readAsDataURL(f); return;
  }
  if (el.dataset.newver !== undefined) {

    const ext = f.name.split('.').pop().toLowerCase(); if (ext !== fl.ext) return toast(`수정본은 기존 파일과 같은 형식(${fl.ext})이어야 합니다`);

      if (parts.length > 1 && EXT_UNIT[parts[parts.length - 1]] && !EXT_UNIT[ext]) { toast(`${f.name}: 이중 확장자 파일은 올릴 수 없습니다`); continue; }
      if (!EXT_UNIT[ext]) { toast(`${f.name}: 허용되지 않는 형식입니다`); continue; }
      if ((ext === 'pdf' && f.type && !f.type.includes('pdf')) || (['png', 'jpg', 'jpeg'].includes(ext) && f.type && !f.type.startsWith('image/'))) { toast(`${f.name}: 확장자와 실제 형식이 다릅니다`); continue; }

    render();
  }
  el.value = '';
}

  seedClear: el => { const cid = el.dataset.cid; const ps = S.projects.filter(p => p.cid === cid);

  asConfirm: el => { const a = S.assign.find(x => x.id === el.dataset.id); a.checkedAt = now(); a.checkedBy = S.me;

  ty: el => { const t = activeTab(); t.st.ty = el.dataset.k; t.st.ds = null; t.st.conf = null; t.st.showDiff = false; render(); },
  guideSave: () => { const t = activeTab(); const g = S.guides[t.st.ty]; g.principles = $('#g-pr').value; g.good = $('#g-gd').value.split('\n').filter(Boolean).map(l => l.split('>').map(s => s.trim())); g.check = $('#g-ck').value.split('\n').map(s => s.trim()).filter(Boolean); S.guideLog.unshift({ type: t.st.ty, at: now(), by: S.me, what: '가이드·체크리스트 수정' }); toast('가이드를 저장했습니다'); render(); },
  dsSel: el => { const t = activeTab(); t.st.ds = el.dataset.id; t.st.conf = null; t.st.showDiff = false; render(); },
  dsNew: () => { const t = activeTab(); const list = S.datasets.filter(d => d.type === t.st.ty); const dep = list.filter(d => d.status === 'deployed').sort((a, b) => b.v - a.v)[0]; const d = { id: uid('ds'), type: t.st.ty, v: Math.max(...list.map(x => x.v)) + 1, status: 'draft', rules: clone(dep?.rules || []).map(r => ({ ...r, id: uid('r') })), at: now(), by: S.me }; S.datasets.push(d); t.st.ds = d.id; render(); },
  dsConflict: () => { const t = activeTab(); const d = S.datasets.find(x => x.id === t.st.ds); const res = t.st.res || (t.st.res = {}); const conf = [];
    const others = d.type === '공통' ? TYPES.map(ty => S.datasets.filter(x => x.type === ty && x.status === 'deployed').sort((a, b) => b.v - a.v)[0]).filter(Boolean) : [S.datasets.filter(x => x.type === '공통' && x.status === 'deployed').sort((a, b) => b.v - a.v)[0]];
    others.forEach(o => o.rules.forEach(or => { const mine = d.rules.find(r => r.p === or.p); if (mine && mine.s !== or.s && !res[d.id + or.p]) conf.push({ p: or.p, a: d.type === '공통' ? mine.s : or.s, b: d.type === '공통' ? or.s : mine.s }); }));
    t.st.conf = conf; render(); },
  resolve: el => { const t = activeTab(); const d = S.datasets.find(x => x.id === t.st.ds); if (el.dataset.w === 'common' && d.type !== '공통') d.rules = d.rules.filter(r => r.p !== el.dataset.p); t.st.res = t.st.res || {}; t.st.res[d.id + el.dataset.p] = el.dataset.w; A.dsConflict(); },
  dsDiff: () => { const t = activeTab(); t.st.showDiff = !t.st.showDiff; render(); },
  ruleAdd: () => { const d = S.datasets.find(x => x.id === activeTab().st.ds); d.rules.push({ id: uid('r'), p: '', s: '', r: '' }); activeTab().st.conf = null; render(); },
  ruleDel: el => { const d = S.datasets.find(x => x.id === activeTab().st.ds); d.rules = d.rules.filter(r => r.id !== el.dataset.id); activeTab().st.conf = null; render(); },
  dsDeploy: () => { const t = activeTab(); const d = S.datasets.find(x => x.id === t.st.ds); if (!t.st.conf) return toast('배포 전에 충돌 검사를 실행하세요'); if (t.st.conf.length) return toast('해결하지 않은 충돌이 있습니다'); if (d.rules.some(r => !r.p || !r.s)) return toast('비어 있는 규칙이 있습니다');
    deployModal(d, `${d.type} v${d.v} 배포`, () => { d.status = 'deployed'; d.at = now(); d.by = S.me; return d; }); },
  dsRestore: () => { const t = activeTab(); const src = S.datasets.find(x => x.id === t.st.ds); const list = S.datasets.filter(x => x.type === src.type); const cur_ = list.filter(x => x.status === 'deployed').sort((a, b) => b.v - a.v)[0];
    deployModal(src, `v${src.v} 내용을 새 버전으로 복원 배포`, () => { const n = { id: uid('ds'), type: src.type, v: Math.max(...list.map(x => x.v)) + 1, status: 'deployed', rules: clone(src.rules), at: now(), by: S.me, restoredFrom: src.v }; S.datasets.push(n); S.audit.unshift({ at: now(), by: S.me, act: '교정 데이터셋 복원', target: `${src.type}`, detail: `v${cur_.v} → v${n.v} (v${src.v} 내용)` }); t.st.ds = n.id; return n; }); },
  noticeEdit: el => { const n = S.notices.find(x => x.id === el.dataset.id); const ps = S.projects.filter(p => p.cid === S.cid);
    showModal({ title: n ? '공지 수정' : '공지 작성', m: n ? { scope: n.scope, pid: n.pid || ps[0].id, title: n.title, body: n.body, bundle: n.bundle || '' } : { scope: 'project', pid: S.pid, bundle: '' }, body: () => `${mSel('scope', '공지 범위', [['project', '프로젝트 공지'], ['customer', `고객사 전체 공지 (${Cu(S.cid).name})`]])}
      ${M('scope') === 'project' ? mSel('pid', '프로젝트', ps.map(p => [p.id, p.name])) : ''}${M('scope') === 'standard' ? mSel('bundle', '연결할 배포 묶음', [['', '선택'], ...S.bundles.map(b => [b.id, `${b.id}  ${b.type} v${b.v}  ${fD(b.at)}`])], 1) : ''}
      ${M('scope') === 'customer' ? '<p class="small muted" style="margin-top:0">고객사 전체 구성원에게 보이며 프로젝트나 역할로 거르지 않습니다.</p>' : ''}${mIn('title', '제목', '', 1)}${mTa('body', '내용', '', 1)}`, ok: n ? '수정' : '게시', onOk: () => {
        if (!need(['title', '제목'], ['body', '내용'])) return false; if (M('scope') === 'standard' && !M('bundle')) { toast('기준 변경 공지는 배포 묶음에 연결해야 합니다'); return false; }
        const o = n || { id: uid('n'), by: S.me, at: now(), log: [], withdrawn: false }; if (n) o.log.push({ at: now(), act: '수정', prev: n.title });
        Object.assign(o, { scope: M('scope'), cid: ['project', 'customer'].includes(M('scope')) ? S.cid : null, pid: M('scope') === 'project' ? M('pid') : null, title: M('title'), body: M('body'), bundle: M('scope') === 'standard' ? M('bundle') : null });
        if (o.bundle) S.bundles.find(b => b.id === o.bundle).noticeId = o.id; if (!n) S.notices.unshift(o); toast(n ? '공지를 수정했습니다. 이전 내용은 이력으로 남습니다' : '공지를 게시했습니다'); render(); } }); },
  noticeWithdraw: el => { const n = S.notices.find(x => x.id === el.dataset.id); showModal({ title: '공지를 철회할까요?', sub: '목록과 알림에서 사라지고 철회 이력은 남습니다.', body: () => '', ok: '철회', okCls: 'warn', onOk: () => { n.withdrawn = true; n.log.push({ at: now(), act: '철회' }); render(); } }); }
};
function deployModal(d, title, apply) {
  showModal({ title, sub: '배포하면 변경할 수 없는 배포 묶음이 만들어지고, 이후 실행하는 텍스트 교정부터 적용됩니다.', m: { post: true, nt: `${d.type} 교정 기준 배포 안내` }, body: () => `<p class="small">규칙 ${d.rules.length}개</p><label class="chk"><input type="checkbox" data-m="post" ${M('post') ? 'checked' : ''}>기준 변경 공지 게시</label>${M('post') ? `<div style="margin-top:10px">${mIn('nt', '공지 제목', '', 1)}</div>` : ''}`, ok: '배포', onOk: () => {
    const x = apply(); const b = { id: 'DB-' + (100 + S.bundles.length), dsId: x.id, type: x.type, v: x.v, at: now(), by: S.me, rules: clone(x.rules), noticeId: null }; S.bundles.push(b); x.bundle = b.id;
    if (M('post')) { const n = { id: uid('n'), scope: 'standard', cid: null, pid: null, title: M('nt'), body: `${x.type} v${x.v} 규칙 ${x.rules.length}개가 배포되었습니다.${x.restoredFrom ? ` v${x.restoredFrom} 내용을 복원했습니다.` : ''}`, by: S.me, at: now(), log: [], withdrawn: false, bundle: b.id }; S.notices.unshift(n); b.noticeId = n.id; }
    S.audit.unshift({ at: now(), by: S.me, act: '교정 데이터셋 배포', target: `${x.type} v${x.v}`, detail: b.id }); activeTab().st.conf = null; toast(`${b.id} 배포 묶음을 만들었습니다`); render(); } });
}
function copyText(s) { try { navigator.clipboard.writeText(s).then(() => toast('문안을 복사했습니다'), () => toast('복사하지 못했습니다. 직접 선택해 복사하세요')); } catch (e) { toast('복사하지 못했습니다'); } }

/* xlsx bulk */
function bulkBody() {
  const { r } = cur(); const cols = r.type === '알림톡' ? '승인템플릿, 본문, 버튼명, 버튼링크' : '발신자, 본문, 수신거부문구포함 (Y 또는 N)';
  const rows = UI.bulkRows;
  return `<p class="small muted" style="margin-top:0">${r.type} 열 구성: ${cols}. 첫 행은 머리글입니다. ${flag('최대 행 수 협의')}</p>
  <div class="row" style="margin-bottom:14px"><label class="btn">XLSX 파일 선택<input type="file" hidden accept=".xlsx" data-xlsx="1"></label><button class="btn ghost" data-a="bulkSample">샘플 데이터로 보기</button><button class="btn ghost" data-a="bulkTpl">${IC.down}템플릿 받기</button></div>
  ${rows ? `<div class="small" style="margin-bottom:8px">전체 ${rows.length}행, 반영 가능 ${rows.filter(x => !x.err.length).length}행, 제외 ${rows.filter(x => x.err.length).length}행</div><div class="panel tbl-wrap"><table class="tbl"><thead><tr><th></th><th>행</th>${(r.type === '알림톡' ? ['승인템플릿', '본문', '버튼명', '버튼링크'] : ['발신자', '본문', '수신거부']).map(h => `<th>${h}</th>`).join('')}<th>결과</th></tr></thead><tbody>
  ${rows.map((x, i) => `<tr><td><input type="checkbox" data-a="bulkSel" data-i="${i}" ${x.sel ? 'checked' : ''} ${x.err.length ? 'disabled' : ''} aria-label="${x.row}행 선택"></td><td>${x.row}</td>${x.v.map(v => `<td class="small" style="max-width:220px">${esc(v)}</td>`).join('')}<td class="small">${x.err.length ? `<span style="color:var(--danger)">제외: ${x.err.join(', ')}</span>` : '반영 가능'}</td></tr>`).join('')}</tbody></table></div>` : ''}`;
}
function parseRows(rows) {
  const { r } = cur(); const p = P(r.pid);
  UI.bulkRows = rows.slice(1).filter(x => x.some(v => String(v ?? '').trim())).map((x, i) => { const v = x.map(y => String(y ?? '').trim()); const err = [];
    if (r.type === '알림톡') { while (v.length < 4) v.push(''); if (!p.tpls.some(t => t.code === v[0])) err.push('승인 템플릿 없음'); if (!v[1]) err.push('본문 없음'); if (!!v[2] !== !!v[3]) err.push('버튼명과 링크를 함께 입력'); if (v[3] && !/^https:\/\//.test(v[3])) err.push('링크는 https'); }
    else { while (v.length < 3) v.push(''); if (!p.senders.includes(v[0])) err.push('등록되지 않은 발신번호'); if (!v[1]) err.push('본문 없음'); if (!['Y', 'N'].includes(v[2].toUpperCase())) err.push('수신거부 값은 Y 또는 N'); }
    return { row: i + 2, v: v.slice(0, r.type === '알림톡' ? 4 : 3), err, sel: !err.length }; });
  renderOv();
}
function readXlsx(file) {
  if (!window.XLSX) return toast('XLSX 읽기 도구를 불러오지 못했습니다');
  const rd = new FileReader(); rd.onload = () => { try { const wb = XLSX.read(rd.result, { type: 'array' }); const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 }); parseRows(rows); } catch (e) { toast('파일을 읽지 못했습니다. XLSX 형식인지 확인하세요'); } }; rd.readAsArrayBuffer(file);
}

/* boot */
render();

</script>
