spring:
  application:
    name: txtms-api
  config:
    # Local secrets written by scripts/dev-db.ps1. Real deployments use environment variables.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 100
  flyway:
    enabled: true
  servlet:
    multipart:
      # Above the attachment limit so the application can reject oversize files with its own message.
      max-file-size: 25MB
      max-request-size: 30MB

server:
  port: ${SERVER_PORT:4245}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    org.hibernate.orm.connections.pooling: WARN

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: 15m
  session:
    idle-timeout: 30m
    remember-duration: 14d
    touch-interval: 1m
  auth:
    refresh-cookie-name: txtms_refresh
    # Secure cookie (HTTPS). The dev profile turns it off for http://localhost.
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}
    login-max-failures: 5
    login-lock-duration: 15m
    password-reset-ttl: 1h
    invitation-ttl: 7d
    # Email change confirmation link mailed to the new address.
    email-change-ttl: 24h
  lock:
    ttl: 30m
    # Releases idle locks every minute and writes "편집 잠금 자동 해제".
    release-job-enabled: true
  audit:
    retention:
      # Daily deletion of access/export audit records written more than `years` (KST calendar) ago — agreed 2026-10-08.
      enabled: true
      years: 3
      cron: "0 30 3 * * *"
  reminder:
    # Re-notification of unfinished work: 24h apart, at most 3 per request and user.
    job-enabled: true
    interval: 24h
    max-count: 3
  # Public web origin: invitation/reset links and the trusted origin of refresh calls.
  web-base-url: ${WEB_BASE_URL:http://localhost:4246}
  cors:
    # Comma-separated extra origins allowed to call the API directly.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  demo:
    # Demo seed and demo accounts. Never enable in production (the dev server sets DEMO_ENABLED=true).
    enabled: ${DEMO_ENABLED:false}
    # Password given to demo accounts when they are first seeded.
    default-password: ${DEMO_DEFAULT_PASSWORD:}
    # One-click persona login (persona list, demo-login, persona switcher). Needs demo mode; off by default so
    # everyone logs in with email and password.
    persona-login-enabled: false
    # Temporary self sign-up page (/signup) for trying every role. Needs demo mode, so it is never open in production.
    signup-enabled: ${DEMO_SIGNUP_ENABLED:true}
  attachment:
    max-file-size: 20MB
    max-count: 10
    max-total-size: 100MB
    max-image-size: 5MB
  storage:
    # TODO(stub): local disk until object storage is connected. Relative paths resolve from the working directory.
    local-root: ${STORAGE_ROOT:storage}
  content:
    # Server-protection caps (LIMIT_EXCEEDED on save), separate from the channel specification below.
    max-contents-per-request: 1000
    max-text-length: 10000
    max-buttons: 20
    max-cards: 5
    max-info-text-length: 2000
  channel-spec:
    # Channel limits (client confirmation 01, 2026-10-12): warnings only, never block saving or submitting.
    alimtalk:
      body-max-chars: 1000
      buttons-max: 5
      button-name-max-chars: 14
    sms:
      sms-max-bytes: 90
      lms-max-bytes: 2000
      encoding: EUC-KR
  bulk:
    max-rows: 1000
    max-file-size: 20MB
  sms:
    customer-center-line: "고객센터 1588-0000"
    opt-out-line: "무료 수신거부 080-000-0000"
  correction:
    # Time budget of one regular-expression rule on one text field (catastrophic backtracking guard).
    rule-timeout: 200ms
    max-rules: 5000
    max-file-size: 10MB
