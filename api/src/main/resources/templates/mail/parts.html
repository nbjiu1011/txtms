<!DOCTYPE html>
<!-- Pieces shared by the mails (contract §23): th:replace="~{mail/parts :: button(${link}, '라벨')}". -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Call-to-action button with the plain address under it (some clients block buttons or links). -->
<table th:fragment="button(href, label)" role="presentation" cellpadding="0" cellspacing="0" border="0"
       style="margin:24px 0 8px;">
  <tr>
    <td style="background-color:#1f2b4d; border-radius:8px;">
      <a th:href="${href}" th:text="${label}" href="#"
         style="display:inline-block; padding:12px 24px; color:#ffffff; font-size:14px; font-weight:700;
                text-decoration:none; border-radius:8px;">바로가기</a>
    </td>
  </tr>
</table>

<p th:fragment="fallback(href)" style="margin:16px 0 0; font-size:12px; line-height:1.6; color:#5a6475;">
  버튼이 열리지 않으면 아래 주소를 복사해 브라우저에 붙여 넣으세요.<br>
  <a th:href="${href}" th:text="${href}" href="#" style="color:#2e62c9; word-break:break-all;">https://</a>
</p>
</body>
</html>
