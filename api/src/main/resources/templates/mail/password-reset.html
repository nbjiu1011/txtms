<!DOCTYPE html>
<!-- 비밀번호 재설정 (MailKind.PASSWORD_RESET). Model: name, link, hours. -->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{mail/layout :: layout(~{::h1}, ~{::section})}">
<body>
<h1 style="margin:0; font-size:20px; line-height:1.4;">비밀번호 재설정</h1>
<section>
  <p style="margin:0 0 12px;"><b th:text="${name}">이름</b>님, 비밀번호 재설정 요청을 받았습니다.</p>
  <p style="margin:0;">아래 버튼을 눌러 새 비밀번호를 설정하세요.</p>
  <table th:replace="~{mail/parts :: button(${link}, '새 비밀번호 설정')}"></table>
  <p style="margin:0; font-size:13px; color:#5a6475;">
    링크는 <b th:text="${hours} + '시간'">1시간</b> 동안 한 번만 쓸 수 있습니다.
    요청한 적이 없다면 이 메일을 무시하세요. 비밀번호는 바뀌지 않습니다.
  </p>
  <p th:replace="~{mail/parts :: fallback(${link})}"></p>
</section>
</body>
</html>
