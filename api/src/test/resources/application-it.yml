# Integration tests: local MariaDB 10.11 test database (TEST_DB_* from the environment or api/.env), separate from the
# development database (DB_*), which may point to a shared server with other credentials.
spring:
  datasource:
    url: ${TEST_DB_URL}
    username: ${TEST_DB_USERNAME}
    password: ${TEST_DB_PASSWORD}
  flyway:
    clean-disabled: false

app:
  lock:
    # Tests run the release explicitly (ContentLockService.releaseExpired) against the adjustable clock.
    release-job-enabled: false
  reminder:
    # Tests run the reminders explicitly (ReminderService.run) against the adjustable clock.
    job-enabled: false
  auth:
    refresh-cookie-secure: false
  demo:
    enabled: true
    default-password: "Txtms!2026"
  storage:
    local-root: build/it-storage
