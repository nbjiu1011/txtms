# txtms-api.tagoplus.co.kr → api container (127.0.0.1:4245)
#
# The web app does not need this name (it reaches the API inside the stack). It is for direct API
# access such as health checks and tools. Leave it disabled if nothing uses it.
#
# Install:
#   sudo a2enmod proxy proxy_http headers ssl
#   sudo cp txtms-api.conf /etc/apache2/sites-available/
#   sudo a2ensite txtms-api && sudo apachectl configtest && sudo systemctl reload apache2
#   sudo certbot --apache -d txtms-api.tagoplus.co.kr

<VirtualHost *:80>
    ServerName txtms-api.tagoplus.co.kr

    ProxyPreserveHost On
    ProxyRequests Off

    RequestHeader unset X-Forwarded-For
    RequestHeader unset X-Forwarded-Host
    RequestHeader unset X-Forwarded-Proto
    RequestHeader unset Forwarded
    RequestHeader set X-Forwarded-Proto "expr=%{REQUEST_SCHEME}"

    ProxyPass        / http://127.0.0.1:4245/ timeout=120 connectiontimeout=5 retry=0 keepalive=On
    ProxyPassReverse / http://127.0.0.1:4245/

    LimitRequestBody 31457280

    ErrorLog  ${APACHE_LOG_DIR}/txtms_api_error.log
    CustomLog ${APACHE_LOG_DIR}/txtms_api_access.log combined
</VirtualHost>
