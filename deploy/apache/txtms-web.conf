# txtms.tagoplus.co.kr → web container (127.0.0.1:4246)
#
# The browser only talks to this origin: pages and `/api/*`, which the Next server forwards to the API
# container. So the attachment upload limit applies here.
#
# Install:
#   sudo a2enmod proxy proxy_http headers ssl
#   sudo cp txtms-web.conf /etc/apache2/sites-available/
#   sudo a2ensite txtms-web && sudo apachectl configtest && sudo systemctl reload apache2
#   sudo certbot --apache -d txtms.tagoplus.co.kr      # creates the :443 vhost from this one

<VirtualHost *:80>
    ServerName txtms.tagoplus.co.kr

    ProxyPreserveHost On
    ProxyRequests Off

    # Drop client-sent forwarding headers and write our own, so a client cannot forge its address or scheme.
    RequestHeader unset X-Forwarded-For
    RequestHeader unset X-Forwarded-Host
    RequestHeader unset X-Forwarded-Proto
    RequestHeader unset Forwarded
    RequestHeader set X-Forwarded-Proto "expr=%{REQUEST_SCHEME}"

    # retry=0: with the default (60) Apache marks the backend dead for a minute after a failed
    # request, which turns every container restart into up to a minute of 503.
    ProxyPass        / http://127.0.0.1:4246/ timeout=120 connectiontimeout=5 retry=0 keepalive=On
    ProxyPassReverse / http://127.0.0.1:4246/

    # Attachment uploads go through here (API limit: 25 MB per file, 30 MB per request).
    LimitRequestBody 31457280

    ErrorLog  ${APACHE_LOG_DIR}/txtms_web_error.log
    CustomLog ${APACHE_LOG_DIR}/txtms_web_access.log combined
</VirtualHost>
