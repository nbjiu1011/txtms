# ════════════════════════════════════════════════════════════
#  txtms — GitLab CI/CD
#
#  Branch → environment
#    dev   → development (dev server 112.160.125.11) · automatic
#    main  → production  (production server)          · manual (one click)
#
#  One job per deploy: load ENV_FILE → build api + web images on the server → `compose up --wait`.
#  Kept fast on purpose:
#    - no separate verify/build stages and no test run in CI (run the checks before pushing — README);
#    - images are built on the deploy server itself, so there is no registry push/pull;
#    - Docker layer caching skips an unchanged service entirely (a web-only commit does not rebuild
#      the API, a test-only commit rebuilds nothing), and BuildKit cache mounts keep Gradle/npm/Next
#      caches between builds;
#    - `compose up` recreates only the containers whose image changed.
#
#  Server setup (runner registration, ENV_FILE, Apache) is in deploy/README.md.
# ════════════════════════════════════════════════════════════

stages:
  - deploy

variables:
  GIT_STRATEGY: fetch
  GIT_DEPTH: "1"
  DOCKER_BUILDKIT: "1"
  # SHA-tagged images kept per service for rollback.
  IMAGE_KEEP: "3"

.deploy:
  stage: deploy
  script:
    # ── ENV_FILE → deploy/.env ───────────────────────────────
    # A shell runner removes untracked files at the start of each job, so the secrets do not stay on disk.
    - |
      if [ -z "${ENV_FILE:-}" ]; then
        echo "ERROR: ENV_FILE was not given to this job (environment: ${CI_ENVIRONMENT_NAME})."
        echo "  - Register it: Settings > CI/CD > Variables, Type File, Key ENV_FILE,"
        echo "    Environment scope ${CI_ENVIRONMENT_NAME} (or *). Content: deploy/.env.example."
        echo "  - Already registered? A Protected variable is only given to protected branches;"
        echo "    protect '${CI_COMMIT_REF_NAME}' or turn Protect off for this variable."
        exit 1
      fi
      if [ ! -f "$ENV_FILE" ]; then
        echo "ERROR: ENV_FILE is not a file path. Register it with Type: File."
        exit 1
      fi
      # Strip CR: a value pasted from Windows would otherwise end every setting with an invisible character.
      tr -d '\r' < "$ENV_FILE" > deploy/.env
      chmod 600 deploy/.env
    - |
      MISSING=0
      for key in DB_URL DB_USERNAME DB_PASSWORD JWT_SECRET WEB_BASE_URL; do
        if ! grep -q "^${key}=." deploy/.env; then echo "ERROR: ${key} is missing in ENV_FILE"; MISSING=1; fi
      done
      [ "$MISSING" = "0" ] || exit 1
      # The web server forwards the browser's Origin to the API, so a CORS list without the web origin
      # would refuse every POST (403 "Invalid CORS request") while the site itself loads fine.
      WEB=$(grep '^WEB_BASE_URL=' deploy/.env | head -1 | cut -d= -f2- | sed 's#/*$##')
      CORS=$(grep '^CORS_ALLOWED_ORIGINS=' deploy/.env | head -1 | cut -d= -f2- || true)
      if [ -n "$CORS" ] && ! echo ",$CORS," | tr -d ' ' | grep -qF ",$WEB,"; then
        echo "ERROR: CORS_ALLOWED_ORIGINS ($CORS) must include WEB_BASE_URL ($WEB)"
        exit 1
      fi
      echo "--- settings (secrets omitted) ---"
      grep -E '^(DB_URL|WEB_BASE_URL|CORS_ALLOWED_ORIGINS|REFRESH_COOKIE_SECURE|DEMO_ENABLED)=' deploy/.env || true
    # Stack name and ports belong to the pipeline, not to ENV_FILE, so the two cannot disagree.
    - |
      {
        echo ""
        echo "COMPOSE_PROJECT_NAME=${STACK}"
        echo "API_PORT=${API_PORT}"
        echo "WEB_PORT=${WEB_PORT}"
      } >> deploy/.env
      echo "stack=${STACK} api=127.0.0.1:${API_PORT} web=127.0.0.1:${WEB_PORT} sha=${CI_COMMIT_SHORT_SHA}"

    - cd deploy
    - docker compose config --quiet
    # api and web build in parallel.
    - docker compose build
    # Waits for both health checks (the API one includes the database).
    - |
      if ! docker compose up -d --wait --wait-timeout 240; then
        echo "ERROR: the stack did not become healthy"
        docker compose ps
        docker compose logs --tail=150 api web
        exit 1
      fi
    - docker compose ps

    # ── rollback tags and cleanup ────────────────────────────
    # Rollback: docker tag <stack>-api:<sha> <stack>-api:latest && docker compose up -d   (in deploy/)
    - |
      for svc in api web; do
        repo="${STACK}-${svc}"
        docker tag "${repo}:latest" "${repo}:${CI_COMMIT_SHORT_SHA}"
        docker images "$repo" --format '{{.Tag}}' | grep -v '^latest$' | tail -n "+$((IMAGE_KEEP + 1))" \
          | while read -r tag; do docker rmi "${repo}:${tag}" >/dev/null 2>&1 || true; done || true
      done
      docker image prune -f >/dev/null
      # Build cache unused for two weeks (the Gradle/npm cache mounts stay while builds keep using them).
      docker builder prune -f --filter until=336h >/dev/null || true

deploy:dev:
  extends: .deploy
  tags:
    - txtms-dev
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
  environment:
    name: development
    url: https://txtms.tagoplus.co.kr
  resource_group: development
  variables:
    STACK: txtms-dev
    API_PORT: "4245"
    WEB_PORT: "4246"

deploy:prod:
  extends: .deploy
  # Runner on the production server. Until it exists this job waits for a runner.
  tags:
    - txtms-prod
  rules:
    # Manual so that a merge to main does not change production by itself.
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  environment:
    name: production
  resource_group: production
  variables:
    STACK: txtms
    API_PORT: "4245"
    WEB_PORT: "4246"
